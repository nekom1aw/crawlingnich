<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Crawling Berita</title>

  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen">

<div x-data="app()" class="max-w-5xl mx-auto p-6">

  <h1 class="text-xl font-bold mb-4">Crawling Berita</h1>

  <div class="bg-white p-4 border mb-4">
    <textarea x-model="primary" class="w-full border p-2 mb-2" placeholder="Keyword utama"></textarea>
    <textarea x-model="secondary" class="w-full border p-2 mb-2" placeholder="Keyword kedua"></textarea>

    <button @click="run()" class="bg-blue-600 text-white px-4 py-2 w-full">
      Jalankan Crawling
    </button>
  </div>

  <div x-show="loading" class="text-gray-500">Loading...</div>
  <div x-show="error" class="text-red-500" x-text="error"></div>

  <template x-for="item in results">
    <div class="border p-2 mb-2 bg-white">
      <a :href="item.link" target="_blank" class="text-blue-600 font-semibold">
        <span x-text="item.title"></span>
      </a>
      <div class="text-sm text-gray-500" x-text="item.source"></div>
    </div>
  </template>

</div>

<script>
function app(){
  return {
    primary: 'mangrove',
    secondary: 'jakarta',
    results: [],
    loading: false,
    error: null,

    async run(){
      this.loading = true;
      this.error = null;
      this.results = [];

      try {
        const res = await fetch('/api/crawl-all.js', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            primaryKeywords: this.primary.split(',').map(x=>x.trim()),
            secondaryKeywords: this.secondary.split(',').map(x=>x.trim())
          })
        });

        // 🔥 FIX UTAMA DI SINI
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Server error');
        }

        this.results = data.results || [];

      } catch (e) {
        console.error(e);
        this.error = "Gagal ambil data";
      }

      this.loading = false;
    }
  }
}
</script>

</body>
</html>
