<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Beta Crawling</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important; }

  :root {
    --bg: #0d0f14;
    --bg2: #13161d;
    --bg3: #1a1e28;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #f0f2f8;
    --text2: #8b90a0;
    --text3: #555c6e;
    --accent: #ffffff;
    --accent2: #b8bcc8;
    --green: #d8dbe2;
    --font-head: 'Syne', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'DM Mono', monospace;
    --radius: 0px;
    --radius-lg: 0px;
  }

  body { font-family: var(--font-body); background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }
  .shell { display: grid; grid-template-rows: 56px 1fr; height: 100vh; overflow: hidden; }
  nav { display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: var(--bg2); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
  .nav-logo { font-family: var(--font-head); font-weight: 800; font-size: 17px; letter-spacing: -0.3px; display: flex; align-items: center; gap: 8px; }
  .logo-dot { width: 8px; height: 8px; background: #fff; }
  .nav-right { display: flex; align-items: center; gap: 16px; }
  .badge-live { display: flex; align-items: center; gap: 5px; font-size: 11px; font-family: var(--font-mono); color: #fff; padding: 3px 10px; border: 1px solid var(--border2); }
  .dot-pulse { width: 6px; height: 6px; background: #fff; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .main { position: relative; display: grid; grid-template-columns: 320px minmax(0, 1fr); overflow: hidden; transition: grid-template-columns 0.2s ease; }
  .main.is-sidebar-collapsed { grid-template-columns: 0 minmax(0, 1fr); }
  .filter-sidebar { background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; padding: 18px 14px; gap: 22px; transition: opacity 0.2s ease, padding 0.2s ease, border-color 0.2s ease; }
  .main.is-sidebar-collapsed .filter-sidebar { opacity: 0; pointer-events: none; padding-left: 0; padding-right: 0; border-color: transparent; overflow: hidden; }
  .filter-sidebar::-webkit-scrollbar { width: 4px; }
  .filter-sidebar::-webkit-scrollbar-thumb { background: var(--border2); }
  .sidebar-handle {
    position: absolute;
    top: 50%;
    left: 320px;
    width: 18px;
    height: 88px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-left: 0;
    color: var(--text2);
    cursor: pointer;
    z-index: 20;
    transform: translateY(-50%);
    transition: left 0.2s ease, color 0.18s ease, border-color 0.18s ease, background 0.18s ease;
  }
  .sidebar-handle:hover { color: var(--text); border-color: #fff; background: var(--bg3); }
  .main.is-sidebar-collapsed .sidebar-handle {
    left: 0;
  }
  .sidebar-handle i {
    transition: transform 0.2s ease;
  }
  .main.is-sidebar-collapsed .sidebar-handle i {
    transform: rotate(180deg);
  }

  .section-label { font-size: 10px; font-weight: 600; letter-spacing: 1.2px; color: var(--text3); text-transform: uppercase; margin-bottom: 10px; }
  .keyword-notice {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    padding: 9px 10px;
    border: 1px solid var(--border2);
    background: rgba(255,255,255,0.05);
    color: var(--text2);
    font-family: var(--font-mono);
    font-size: 11px;
    line-height: 1.4;
  }
  .keyword-notice i { color: #fff; font-size: 14px; }
  .keyword-group { display: flex; flex-direction: column; gap: 10px; }
  .input-wrap { position: relative; }
  .input-wrap .lbl { position: absolute; top: -8px; left: 10px; font-size: 10px; font-family: var(--font-mono); color: #fff; background: var(--bg2); padding: 0 4px; z-index:1; letter-spacing: 0.5px; }
  .input-wrap input { width: 100%; padding: 10px 12px 10px 36px; background: var(--bg3); border: 1px solid var(--border2); color: var(--text); font-family: var(--font-body); font-size: 13px; outline: none; transition: border-color 0.2s; }
  .input-wrap input:focus { border-color: #fff; }
  .input-wrap input::placeholder { color: var(--text3); }
  .input-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 15px; pointer-events: none; }

  .tags-list { display: flex; flex-wrap: wrap; gap: 6px; min-height: 36px; }
  .tag { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; font-size: 11px; font-family: var(--font-mono); cursor: pointer; transition: 0.2s; border: 1px solid var(--border2); }
  .tag-primary { background: rgba(255,255,255,0.08); color: #fff; }
  .tag-secondary { background: rgba(255,255,255,0.04); color: var(--accent2); }
  .tag .remove { opacity: 0.5; font-size: 12px; }

  .type-filter { display: flex; flex-direction: column; gap: 6px; }
  .type-btn { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: transparent; border: 1px solid transparent; color: var(--text2); cursor: pointer; font-family: var(--font-body); font-size: 13px; transition: 0.2s; width: 100%; text-align: left; }
  .type-btn.active { background: rgba(255,255,255,0.08); border-color: var(--border2); color: #fff; }
  .type-btn:hover:not(.active) { background: var(--bg3); }
  .type-count { margin-left: auto; font-size: 11px; font-family: var(--font-mono); background: var(--bg3); padding: 2px 7px; }

  .date-filter { display: flex; flex-direction: column; gap: 10px; }
  .between-box {
    border: 1px solid var(--border2);
    background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
    padding: 12px;
  }
  .between-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .between-label {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #fff;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .between-clear {
    background: transparent;
    border: 0;
    color: var(--text3);
    cursor: pointer;
    font-size: 11px;
    font-family: var(--font-mono);
    padding: 0;
    transition: color 0.18s ease;
  }
  .between-clear:hover { color: #fff; }
  .between-inputs { display: block; }
  .range-picker {
    width: 100%;
    height: 44px;
    padding: 0 12px;
    background: rgba(0,0,0,0.32);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text);
    font-size: 12px;
    font-family: var(--font-mono);
    outline: none;
    cursor: pointer;
    transition: border-color 0.18s ease, background 0.18s ease;
  }
  .range-picker:focus,
  .range-picker:hover {
    border-color: rgba(255,255,255,0.85);
    background: rgba(0,0,0,0.45);
  }
  .flatpickr-calendar {
    background: var(--bg2);
    border: 1px solid var(--border2);
    box-shadow: 0 14px 40px rgba(0,0,0,0.35);
  }
  .flatpickr-calendar.arrowTop:before,
  .flatpickr-calendar.arrowTop:after { display: none; }
  .flatpickr-months .flatpickr-month,
  .flatpickr-current-month,
  .flatpickr-weekdays,
  span.flatpickr-weekday,
  .flatpickr-day,
  .numInputWrapper span,
  .flatpickr-monthDropdown-months,
  .flatpickr-monthDropdown-month { color: var(--text); }
  .flatpickr-monthDropdown-months,
  .numInput.cur-year { background: var(--bg3); }
  .flatpickr-day { border-color: transparent; }
  .flatpickr-day.today { border-color: transparent; color: var(--text); }
  .flatpickr-day.selected,
  .flatpickr-day.startRange,
  .flatpickr-day.endRange,
  .flatpickr-day.today.selected,
  .flatpickr-day.today.startRange,
  .flatpickr-day.today.endRange {
    background: #fff;
    color: #000;
    border-color: #fff;
  }
  .flatpickr-day.inRange {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.12);
    color: #fff;
    box-shadow: none;
  }
  .flatpickr-day:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.18);
  }
  .date-summary {
    font-size: 12px;
    font-family: var(--font-mono);
    color: #fff;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border2);
    padding: 12px 10px;
    text-align: center;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
  }

  .btn-crawl { width: 100%; padding: 11px; background: #fff; border: none; color: #000; font-family: var(--font-head); font-weight: 700; font-size: 14px; cursor: pointer; letter-spacing: 0.3px; transition: opacity 0.2s, transform 0.15s; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-crawl:hover { opacity: 0.9; }

  .content { display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
  .toolbar { display: flex; align-items: center; gap: 12px; padding: 16px 28px; border-bottom: 1px solid var(--border); background: var(--bg); }
  .search-bar { flex: 1; position: relative; }
  .search-bar input { width: 100%; padding: 9px 12px 9px 36px; background: var(--bg3); border: 1px solid var(--border2); color: var(--text); font-size: 13px; outline: none; font-family: var(--font-body); transition: border-color 0.2s; }
  .search-bar input:focus { border-color: #fff; }
  .search-bar input::placeholder { color: var(--text3); }
  .search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 15px; }

  .stats-bar { display: flex; gap: 20px; padding: 12px 28px; border-bottom: 1px solid var(--border); background: var(--bg); font-size: 12px; }
  .stat-item { display: flex; align-items: center; gap: 6px; color: var(--text2); }
  .stat-item strong { color: var(--text); font-family: var(--font-mono); font-size: 13px; }
  .stat-dot { width: 6px; height: 6px; background:#fff; }

  .results { flex: 1; overflow-y: auto; padding: 22px 28px 18px; display: flex; flex-direction: column; gap: 12px; }
  .result-card { background: var(--bg2); border: 1px solid var(--border); padding: 16px; display: flex; gap: 14px; transition: border-color 0.2s, transform 0.15s; }
  .result-card:hover { border-color: var(--border2); }
  .result-card.is-read {
    background: linear-gradient(90deg, rgba(31, 130, 78, 0.28), rgba(255,255,255,0.025));
    border-color: rgba(113, 255, 174, 0.82);
    box-shadow: inset 3px 0 0 rgba(113, 255, 174, 0.9);
  }
  .result-card.is-read .card-icon {
    border-color: rgba(113, 255, 174, 0.55);
    color: #9dffc1;
  }
  @keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
  @keyframes shimmer {
    0% { background-position: 100% 0; }
    100% { background-position: -100% 0; }
  }

  .card-icon { width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; border:1px solid var(--border2); }
  .icon-news { color: #fff; }
  .icon-journal { color: #c6c9d2; }

  .card-body { flex: 1; min-width: 0; }
  .card-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; flex-wrap: wrap; }
  .type-badge { font-size: 10px; font-family: var(--font-mono); padding: 2px 8px; font-weight: 500; border:1px solid var(--border2); }
  .badge-news { color: #fff; }
  .badge-journal { color: #c6c9d2; }
  .card-source { font-size: 11px; color: var(--text3); font-family: var(--font-mono); }
  .card-date { font-size: 11px; color: var(--text3); margin-left: auto; }
  .card-title { font-size: 14px; font-weight: 500; line-height: 1.45; margin-bottom: 5px; color: var(--text); }
  .card-snippet { font-size: 12px; color: var(--text2); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-footer { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .card-open {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 11px;
    background: #fff;
    border: 1px solid #fff;
    color: #000;
    font-family: var(--font-mono);
    font-size: 11px;
    text-decoration: none;
    transition: opacity 0.15s ease;
  }
  .card-open:hover { opacity: 0.86; }
  .card-open.is-read {
    background: #9dffc1;
    border-color: #9dffc1;
    color: #06130b;
  }
  .card-open.is-disabled {
    pointer-events: none;
    opacity: 0.35;
  }
  .read-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 8px;
    border: 1px solid rgba(113, 255, 174, 0.58);
    background: rgba(113, 255, 174, 0.12);
    color: #9dffc1;
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.7px;
  }
  .skeleton-card { pointer-events: none; }
  .skeleton-icon,
  .skeleton-pill,
  .skeleton-line,
  .skeleton-button {
    background: linear-gradient(90deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.04) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.3s linear infinite;
  }
  .skeleton-icon { width: 42px; height: 42px; border: 1px solid var(--border2); flex-shrink: 0; }
  .skeleton-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .skeleton-pill { width: 58px; height: 18px; border: 1px solid var(--border2); }
  .skeleton-source { width: 86px; height: 12px; }
  .skeleton-date { width: 74px; height: 12px; margin-left: auto; }
  .skeleton-line { height: 12px; margin-bottom: 8px; }
  .skeleton-line.lg { width: 84%; height: 14px; }
  .skeleton-line.md { width: 96%; }
  .skeleton-line.sm { width: 70%; margin-bottom: 0; }
  .skeleton-footer { display: flex; justify-content: flex-end; margin-top: 12px; }
  .skeleton-button { width: 72px; height: 24px; border: 1px solid var(--border2); }

  .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--text3); padding: 60px 0; }
  .empty i { font-size: 48px; }

  .pagination { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 14px 28px; border-top: 1px solid var(--border); }
  .page-btn { padding: 6px 12px; background: var(--bg3); border: 1px solid var(--border); color: var(--text2); font-size: 12px; cursor: pointer; font-family: var(--font-mono); transition: 0.15s; }
  .page-btn.active { background: rgba(255,255,255,0.14); border-color: #fff; color: #fff; }
  .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  @media (max-width: 1024px) {
    .main { grid-template-columns: 1fr; }
    .main.is-sidebar-collapsed { grid-template-columns: 1fr; }
    .filter-sidebar { max-height: 50vh; }
    .sidebar-handle {
      top: 12px;
      left: auto;
      right: 12px;
      width: 30px;
      height: 30px;
      transform: none;
      border-left: 1px solid var(--border2);
    }
    .main.is-sidebar-collapsed .sidebar-handle {
      left: auto;
      right: 12px;
    }
  }
</style>
</head>
<body>
<div class="shell">
  <nav>
    <div class="nav-logo"><div class="logo-dot"></div>Crawling Beta test</div>
    <div class="nav-right">
      <div class="badge-live"><div class="dot-pulse"></div>ENGINE READY</div>
      <i class="ti ti-settings" style="font-size:18px;color:var(--text3)"></i>
    </div>
  </nav>

  <div class="main">
    <button class="sidebar-handle" id="sidebarHandle" type="button" aria-label="Buka tutup panel kiri">
      <i class="ti ti-chevron-left"></i>
    </button>
    <aside class="filter-sidebar">
      <div>
        <div class="keyword-notice"><i class="ti ti-corner-down-left"></i> klik enter untuk memasukan keyword</div>
        <div class="section-label">Primary Keyword</div>
        <div class="keyword-group">
          <div class="input-wrap primary-tag">

            <i class="ti ti-key input-icon"></i>
            <input type="text" id="primaryInput" placeholder="masukkan kata kunci utama..." />
          </div>
          <div class="tags-list" id="primaryTags"></div>
        </div>
      </div>

      <div>
        <div class="section-label">Secondary Keyword</div>
        <div class="keyword-group">
          <div class="input-wrap secondary-tag">
            
            <i class="ti ti-tag input-icon"></i>
            <input type="text" id="secondaryInput" placeholder="tambah kata kunci pendukung..." />
          </div>
          <div class="tags-list" id="secondaryTags"></div>
        </div>
      </div>

      <div>
        <div class="section-label">Tipe Konten</div>
        <div class="type-filter">
          <button class="type-btn active" data-type="all"><i class="ti ti-world"></i> Semua <span class="type-count" id="cnt-all">0</span></button>
          <button class="type-btn" data-type="news"><i class="ti ti-news"></i> Berita <span class="type-count" id="cnt-berita">0</span></button>
          <button class="type-btn" data-type="journal"><i class="ti ti-book"></i> Jurnal <span class="type-count" id="cnt-jurnal">0</span></button>
        </div>
      </div>

      <div>
        <div class="section-label">Filter Tanggal</div>
        <div class="date-filter">
          <div class="between-box">
            <div class="between-head">
              <div class="between-label"><i class="ti ti-calendar-stats"></i> Between</div>
              <button class="between-clear" id="clearDateBtn" type="button">clear</button>
            </div>
            <div class="between-inputs">
              <input class="range-picker" type="text" id="rangePicker" readonly placeholder="Pilih rentang tanggal">
              <input type="hidden" id="fromDate">
              <input type="hidden" id="toDate">
            </div>
          </div>
          <div class="date-summary" id="dateSummary">— pilih rentang tanggal —</div>
        </div>
      </div>

      <button class="btn-crawl" id="crawlBtn"><i class="ti ti-radar" style="font-size:16px"></i> Mulai Crawling</button>
    </aside>

    <div class="content">
      <div class="toolbar">
        <div class="search-bar">
          <i class="ti ti-search search-icon"></i>
          <input type="text" placeholder="Cari dalam hasil crawling..." id="searchInResults" />
        </div>
      </div>

      <div class="stats-bar">
        <div class="stat-item"><div class="stat-dot"></div><strong id="totalCount">0</strong> total hasil</div>
        <div class="stat-item"><div class="stat-dot"></div><strong id="newsCount">0</strong> berita</div>
        <div class="stat-item"><div class="stat-dot"></div><strong id="journalCount">0</strong> jurnal</div>
      </div>

      <div class="results" id="resultsList"></div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
let DATA = [];
let activeType = 'all';
let currentPage = 1;
let isLoading = false;
let rangePicker = null;
const PER_PAGE = 10;
const READ_LINKS_KEY = 'crawling-read-links';
const MONTHS = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

function getTags(listId) {
  return [...document.querySelectorAll(`#${listId} .tag`)].map(t => t.dataset.value).filter(Boolean);
}

function parseDateInput(inputId, endOfDay = false) {
  const value = document.getElementById(inputId).value;
  if (!value) return null;
  const [year, month, day] = value.split('-').map(Number);
  if (!year || !month || !day) return null;
  return endOfDay ? new Date(year, month - 1, day, 23, 59, 59, 999) : new Date(year, month - 1, day, 0, 0, 0, 0);
}

function getFiltered() {
  const q = document.getElementById('searchInResults').value.toLowerCase();
  const fromDate = parseDateInput('fromDate');
  const toDate = parseDateInput('toDate', true);

  return DATA.filter(d => {
    const matchType = activeType === 'all' || d.type === activeType;
    const matchQ = !q || (d.title || '').toLowerCase().includes(q);

    const itemDate = d.date ? new Date(d.date) : null;
    const validDate = itemDate && !Number.isNaN(itemDate.getTime());

    if (fromDate || toDate) {
      if (!validDate) return false;
      if (fromDate && itemDate < fromDate) return false;
      if (toDate && itemDate > toDate) return false;
    }

    return matchType && matchQ;
  });
}

function formatDateID(dateStr) {
  const d = new Date(dateStr);
  if (Number.isNaN(d.getTime())) return '-';
  return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
}

function escapeHtml(value = '') {
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function safeLink(link) {
  try {
    const url = new URL(String(link || '').trim());
    return ['http:', 'https:'].includes(url.protocol) ? url.toString() : '';
  } catch {
    return '';
  }
}

function getReadLinks() {
  try {
    const links = JSON.parse(localStorage.getItem(READ_LINKS_KEY) || '[]');
    return Array.isArray(links) ? links : [];
  } catch {
    return [];
  }
}

function hasReadLink(link) {
  return getReadLinks().includes(link);
}

function markReadLink(link) {
  if (!link) return;
  const links = new Set(getReadLinks());
  links.add(link);
  localStorage.setItem(READ_LINKS_KEY, JSON.stringify([...links].slice(-500)));
}


function updateCounters(filtered) {
  const news = filtered.filter(x => x.type === 'news').length;
  const journal = filtered.filter(x => x.type === 'journal').length;
  document.getElementById('cnt-all').textContent = filtered.length;
  document.getElementById('cnt-berita').textContent = news;
  document.getElementById('cnt-jurnal').textContent = journal;
  document.getElementById('totalCount').textContent = filtered.length;
  document.getElementById('newsCount').textContent = news;
  document.getElementById('journalCount').textContent = journal;
}

function renderSkeletons(count = 5) {
  const list = document.getElementById('resultsList');
  const pg = document.getElementById('pagination');
  list.innerHTML = Array.from({ length: count }, () => `
    <div class="result-card skeleton-card">
      <div class="skeleton-icon"></div>
      <div class="card-body">
        <div class="skeleton-meta">
          <div class="skeleton-pill"></div>
          <div class="skeleton-line skeleton-source"></div>
          <div class="skeleton-line skeleton-date"></div>
        </div>
        <div class="skeleton-line lg"></div>
        <div class="skeleton-line md"></div>
        <div class="skeleton-line sm"></div>
        <div class="skeleton-footer">
          <div class="skeleton-button"></div>
        </div>
      </div>
    </div>
  `).join('');
  pg.innerHTML = '';
}

function renderResults() {
  if (isLoading) {
    renderSkeletons();
    return;
  }

  const filtered = getFiltered();
  updateCounters(filtered);

  const list = document.getElementById('resultsList');
  const total = filtered.length;
  const pages = Math.max(1, Math.ceil(total / PER_PAGE));
  currentPage = Math.min(currentPage, pages);
  const start = (currentPage - 1) * PER_PAGE;
  const slice = filtered.slice(start, start + PER_PAGE);

  if (!slice.length) {
    list.innerHTML = `<div class="empty"><i class="ti ti-mood-empty"></i><p>Tidak ada hasil ditemukan</p></div>`;
    renderPagination(1);
    return;
  }

  list.innerHTML = slice.map((d) => {
    const link = safeLink(d.link);
    const escapedLink = escapeHtml(link);
    const isRead = Boolean(link && hasReadLink(link));
    const cardClass = isRead ? 'result-card is-read' : 'result-card';
    const openClass = link ? `card-open${isRead ? ' is-read' : ''}` : 'card-open is-disabled';
    const readBadge = isRead ? '<span class="read-badge"><i class="ti ti-check"></i> Sudah dibaca</span>' : '';
    return `
    <div class="${cardClass}">
      <div class="card-icon ${d.type === 'journal' ? 'icon-journal' : 'icon-news'}">
        <i class="ti ${d.type === 'journal' ? 'ti-book' : 'ti-news'}"></i>
      </div>
      <div class="card-body">
        <div class="card-meta">
          <span class="type-badge ${d.type === 'journal' ? 'badge-journal' : 'badge-news'}">${(d.type || '-').toUpperCase()}</span>
          <span class="card-source">${escapeHtml(d.source || 'Unknown')}</span>
          ${readBadge}
          <span class="card-date"><i class="ti ti-calendar" style="font-size:11px"></i> ${formatDateID(d.date)}</span>
        </div>
        <div class="card-title">${escapeHtml(d.title || '-')}</div>
        <div class="card-snippet">${d.matchedKeywords ? `Keyword: ${escapeHtml(d.matchedKeywords)}` : ''}</div>
        <div class="card-footer">
          <a class="${openClass}" href="${escapedLink || '#'}" data-read-link="${escapedLink}" target="_blank" rel="noopener noreferrer">
            <i class="ti ti-external-link" style="font-size:12px"></i> Buka berita
          </a>
        </div>
      </div>
    </div>
  `;
  }).join('');

  renderPagination(pages);
}


function renderPagination(pages) {
  const pg = document.getElementById('pagination');
  if (pages <= 1) { pg.innerHTML = ''; return; }
  let html = `<button class="page-btn" ${currentPage===1?'disabled':''} onclick="goPage(${currentPage-1})"><i class="ti ti-chevron-left"></i></button>`;
  for (let i = 1; i <= pages; i++) {
    html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
  }
  html += `<button class="page-btn" ${currentPage===pages?'disabled':''} onclick="goPage(${currentPage+1})"><i class="ti ti-chevron-right"></i></button>`;
  pg.innerHTML = html;
}

function goPage(p) { currentPage = p; renderResults(); }

document.querySelectorAll('.type-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeType = btn.dataset.type;
    currentPage = 1;
    renderResults();
  });
});

document.getElementById('sidebarHandle').addEventListener('click', () => {
  document.querySelector('.main').classList.toggle('is-sidebar-collapsed');
});

document.getElementById('searchInResults').addEventListener('input', () => { currentPage = 1; renderResults(); });

document.getElementById('resultsList').addEventListener('click', (e) => {
  const openLink = e.target.closest('.card-open:not(.is-disabled)');
  if (!openLink) return;

  const link = openLink.dataset.readLink || openLink.href;
  markReadLink(link);
  openLink.classList.add('is-read');

  const card = openLink.closest('.result-card');
  if (!card) return;
  card.classList.add('is-read');

  const meta = card.querySelector('.card-meta');
  if (meta && !meta.querySelector('.read-badge')) {
    const date = meta.querySelector('.card-date');
    const badge = '<span class="read-badge"><i class="ti ti-check"></i> Sudah dibaca</span>';
    if (date) {
      date.insertAdjacentHTML('beforebegin', badge);
    } else {
      meta.insertAdjacentHTML('beforeend', badge);
    }
  }
});

function toInputDate(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function updateDateSummary() {
  const fromValue = document.getElementById('fromDate').value;
  const toValue = document.getElementById('toDate').value;
  const el = document.getElementById('dateSummary');
  const rangeInput = document.getElementById('rangePicker');
  if (!fromValue && !toValue) {
    rangeInput.value = '';
    el.textContent = '- semua tanggal -';
    return;
  }

  const format = (value) => {
    if (!value) return 'awal';
    const [year, month, day] = value.split('-');
    return `${day} ${MONTHS[Number(month)-1].slice(0,3)} ${year}`;
  };

  rangeInput.value = toValue
    ? `${format(fromValue)} -> ${format(toValue)}`
    : format(fromValue);
  el.textContent = toValue
    ? `${format(fromValue)}  ->  ${format(toValue)}`
    : `${format(fromValue)}  ->  akhir`;
}

function initDateBetween() {
  const now = new Date();
  const firstDay = new Date(now.getFullYear(), now.getMonth(), 1);
  document.getElementById('fromDate').value = toInputDate(firstDay);
  document.getElementById('toDate').value = toInputDate(now);

  rangePicker = flatpickr('#rangePicker', {
    mode: 'range',
    dateFormat: 'Y-m-d',
    defaultDate: [toInputDate(firstDay), toInputDate(now)],
    monthSelectorType: 'dropdown',
    allowInput: false,
    clickOpens: true,
    locale: {
      firstDayOfWeek: 0,
    },
    onChange(selectedDates) {
      document.getElementById('fromDate').value = selectedDates[0] ? toInputDate(selectedDates[0]) : '';
      document.getElementById('toDate').value = selectedDates[1] ? toInputDate(selectedDates[1]) : '';
      updateDateSummary();
      renderResults();
    },
  });

  updateDateSummary();
}

document.getElementById('clearDateBtn').addEventListener('click', () => {
  document.getElementById('fromDate').value = '';
  document.getElementById('toDate').value = '';
  if (rangePicker) rangePicker.clear();
  updateDateSummary();
  renderResults();
});

function addTag(inputId, listId, cls) {
  const inp = document.getElementById(inputId);
  const val = inp.value.trim();
  if (!val) return;
  const list = document.getElementById(listId);
  const exists = [...list.querySelectorAll('.tag')].some(t => t.dataset.value.toLowerCase() === val.toLowerCase());
  if (exists) { inp.value = ''; return; }
  const span = document.createElement('span');
  span.className = `tag ${cls}`;
  span.dataset.value = val;
  span.innerHTML = `${val} <span class="remove">×</span>`;
  list.appendChild(span);
  inp.value = '';
}

document.getElementById('primaryInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); addTag('primaryInput', 'primaryTags', 'tag-primary'); }
});
document.getElementById('secondaryInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); addTag('secondaryInput', 'secondaryTags', 'tag-secondary'); }
});

document.getElementById('primaryTags').addEventListener('click', e => {
  if (e.target.classList.contains('remove')) { e.target.parentElement.remove(); renderResults(); }
});
document.getElementById('secondaryTags').addEventListener('click', e => {
  if (e.target.classList.contains('remove')) { e.target.parentElement.remove(); renderResults(); }
});

async function runCrawl() {
  const primaryKeywords = getTags('primaryTags');
  const secondaryKeywords = getTags('secondaryTags');
  if (!primaryKeywords.length || !secondaryKeywords.length) {
    alert('Primary dan secondary keyword wajib diisi.');
    return;
  }

  const fromDateValue = document.getElementById('fromDate').value || null;
  const toDateValue = document.getElementById('toDate').value || null;

  const payload = {
    primaryKeywords,
    secondaryKeywords,
    startDate: fromDateValue,
    endDate: toDateValue,
  };
  let response;
  isLoading = true;
  renderResults();

  try {
    response = await fetch('/api/crawl-all', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!response.ok) {
      response = await fetch('/api/crawl-all.js', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
    }
  } catch {
    response = await fetch('/api/crawl-all.js', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
  }

  const data = await response.json();
  DATA = Array.isArray(data.results) ? data.results : [];
  currentPage = 1;
  isLoading = false;
  renderResults();
}

document.getElementById('crawlBtn').addEventListener('click', async () => {
  const btn = document.getElementById('crawlBtn');
  btn.innerHTML = '<i class="ti ti-loader-2" style="font-size:16px;animation:spin 1s linear infinite"></i> Crawling...';
  btn.disabled = true;
  try {
    await runCrawl();
  } catch (e) {
    isLoading = false;
    renderResults();
    alert('Gagal crawl: ' + e.message);
  } finally {
    btn.innerHTML = '<i class="ti ti-radar" style="font-size:16px"></i> Mulai Crawling';
    btn.disabled = false;
  }
});

addTag('primaryInput', 'primaryTags', 'tag-primary');
document.getElementById('primaryTags').innerHTML = '';
addTag('secondaryInput', 'secondaryTags', 'tag-secondary');
document.getElementById('secondaryTags').innerHTML = '';
['orangutan'].forEach(v => {
  const s = document.createElement('span');
  s.className = 'tag tag-primary';
  s.dataset.value = v;
  s.innerHTML = `${v} <span class="remove">×</span>`;
  document.getElementById('primaryTags').appendChild(s);
});
['konflik','perdagangan'].forEach(v => {
  const s = document.createElement('span');
  s.className = 'tag tag-secondary';
  s.dataset.value = v;
  s.innerHTML = `${v} <span class="remove">×</span>`;
  document.getElementById('secondaryTags').appendChild(s);
});

initDateBetween();
renderResults();
</script>
</body>
</html>
