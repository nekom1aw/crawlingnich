<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Isu Daerah Realtime</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@500;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link rel="stylesheet" href="/src/header.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important; }
  :root {
    --bg: #0d0f14;
    --bg2: #13161d;
    --bg3: #1a1e28;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #f0f2f8;
    --text2: #8b90a0;
    --text3: #555c6e;
    --green: #9dffc1;
    --font-head: 'Syne', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'DM Mono', monospace;
  }
  body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 14px; overflow: hidden; }
  .shell { display: grid; grid-template-rows: 56px auto 1fr; height: 100vh; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  @keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
  @keyframes shimmer { 0%{background-position:100% 0} 100%{background-position:-100% 0} }

  .control-band { display: grid; grid-template-columns: minmax(260px, 360px) auto minmax(260px, 1fr); gap: 10px; align-items: center; padding: 14px 24px; background: #10131a; border-bottom: 1px solid var(--border); }
  .input-wrap { position: relative; }
  .input-wrap input { width: 100%; height: 40px; padding: 0 12px 0 36px; background: var(--bg3); border: 1px solid var(--border2); color: var(--text); outline: none; font-family: var(--font-body); font-size: 13px; }
  .input-wrap input:focus { border-color: #fff; }
  .input-wrap input::placeholder { color: var(--text3); }
  .input-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 15px; pointer-events: none; }
  .btn { height: 40px; padding: 0 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: #fff; border: 1px solid #fff; color: #000; font-family: var(--font-head); font-weight: 700; cursor: pointer; }
  .btn:disabled { opacity: 0.65; cursor: wait; }
  .tags-list { display: flex; flex-wrap: wrap; gap: 6px; min-height: 32px; align-items: center; }
  .tag { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border: 1px solid rgba(113,255,174,0.42); background: rgba(113,255,174,0.08); color: var(--green); font-size: 11px; font-family: var(--font-mono); cursor: pointer; }
  .tag .remove { opacity: 0.65; }

  .main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); overflow: hidden; }
  .content { min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
  .stats { display: flex; gap: 20px; padding: 12px 24px; border-bottom: 1px solid var(--border); color: var(--text2); font-size: 12px; }
  .stats strong { color: #fff; font-family: var(--font-mono); }
  .results { flex: 1; min-height: 0; overflow: hidden; padding: 22px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); grid-auto-rows: minmax(460px, 1fr); align-items: stretch; gap: 14px; }
  .region-group { min-width: 0; min-height: 0; height: 100%; border: 1px solid var(--border2); background: rgba(255,255,255,0.025); display: flex; flex-direction: column; }
  .region-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 14px; border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.045); }
  .region-title { min-width: 0; display: flex; align-items: center; gap: 8px; font-family: var(--font-head); font-size: 16px; font-weight: 800; }
  .region-title span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .region-count { flex-shrink: 0; color: var(--green); border: 1px solid rgba(113,255,174,0.42); padding: 3px 8px; font-family: var(--font-mono); font-size: 10px; }
  .issue-filter { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.12); }
  .issue-btn { height: 26px; padding: 0 8px; display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--border2); background: rgba(255,255,255,0.025); color: var(--text2); font-family: var(--font-mono); font-size: 10px; cursor: pointer; }
  .issue-btn.active { color: #000; background: #fff; border-color: #fff; }
  .region-list { flex: 1; min-height: 0; padding: 12px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; overscroll-behavior: contain; overflow-anchor: none; }
  .card { background: var(--bg2); border: 1px solid var(--border); padding: 14px; display: flex; gap: 12px; }
  .card:hover { border-color: #fff; background: rgba(255,255,255,0.055); }
  .card-icon { width: 36px; height: 36px; display: grid; place-items: center; flex-shrink: 0; border: 1px solid rgba(113,255,174,0.42); color: var(--green); font-size: 16px; }
  .card-body { min-width: 0; flex: 1; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 7px; color: var(--text3); font-family: var(--font-mono); font-size: 11px; }
  .badge { color: var(--green); border: 1px solid rgba(113,255,174,0.42); padding: 2px 8px; }
  .date { width: 100%; color: var(--text2); }
  .title { color: var(--text); line-height: 1.45; font-weight: 500; margin-bottom: 6px; }
  .snippet { color: var(--text2); font-size: 12px; line-height: 1.6; }
  .open { margin-top: 11px; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; background: #fff; color: #000; text-decoration: none; font-family: var(--font-mono); font-size: 11px; }
  .empty { flex: 1; display: grid; place-items: center; color: var(--text3); text-align: center; line-height: 1.7; }
  .skeleton { pointer-events: none; }
  .skeleton .line, .skeleton .card-icon, .skeleton-region { background: linear-gradient(90deg, rgba(255,255,255,0.04), rgba(255,255,255,0.12), rgba(255,255,255,0.04)); background-size: 200% 100%; animation: shimmer 1.3s linear infinite; }
  .skeleton .line { height: 12px; margin-bottom: 9px; }

  @media (max-width: 1024px) {
    body { overflow: auto; }
    .shell { min-height: 100vh; height: auto; }
    .control-band { grid-template-columns: 1fr; padding: 12px 14px; }
    .main { grid-template-columns: 1fr; overflow: visible; }
    .results { grid-template-columns: 1fr; }
    .region-group { max-height: none; }
  }
</style>
</head>
<body>
<div class="shell">
  <div id="appHeader"></div>

  <section class="control-band">
    <div class="input-wrap">
      <i class="ti ti-map-pin input-icon"></i>
      <input type="text" id="regionInput" placeholder="tambah daerah, contoh: Riau..." />
    </div>
    <button class="btn" id="regionalBtn" type="button"><i class="ti ti-satellite"></i> Pantau Isu</button>
    <div class="tags-list" id="regionTags"></div>
  </section>

  <main class="main">
    <section class="content">
      <div class="stats">
        <span><strong id="totalCount">0</strong> total isu</span>
        <span><strong id="regionCount">0</strong> daerah</span>
        <span id="scanStatus">siap pantau</span>
      </div>
      <div class="results" id="resultsList"></div>
    </section>

  </main>
</div>

<script src="/src/header.js"></script>
<script>
let DATA = [];
let regionIssueFilters = {};
let activeScanId = 0;
let hasSearched = false;
let isArchiveScanning = false;

function escapeHtml(value = '') {
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function safeLink(link) {
  try {
    const url = new URL(String(link || '').trim());
    return ['http:', 'https:'].includes(url.protocol) ? url.toString() : '';
  } catch {
    return '';
  }
}

function formatDateID(dateStr) {
  if (!dateStr) return 'Tanggal tidak tersedia';
  const d = new Date(dateStr);
  if (Number.isNaN(d.getTime()) || d.getFullYear() <= 1970) return 'Tanggal tidak tersedia';
  return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
}

function getTimeValue(dateStr) {
  const time = new Date(dateStr).getTime();
  return Number.isNaN(time) ? 0 : time;
}

function getTags() {
  return [...document.querySelectorAll('#regionTags .tag')].map(tag => tag.dataset.value).filter(Boolean);
}

function addRegion(value) {
  const val = String(value || document.getElementById('regionInput').value).trim();
  if (!val) return;
  const exists = getTags().some(tag => tag.toLowerCase() === val.toLowerCase());
  document.getElementById('regionInput').value = '';
  if (exists) return;

  const span = document.createElement('span');
  span.className = 'tag';
  span.dataset.value = val;
  span.innerHTML = `${escapeHtml(val)} <span class="remove">x</span>`;
  document.getElementById('regionTags').appendChild(span);
  updateCounts();
}

function updateCounts() {
  document.getElementById('totalCount').textContent = DATA.length;
  document.getElementById('regionCount').textContent = getTags().length;
}

function toInputDate(date) {
  return date.toISOString().slice(0, 10);
}

function buildScanWindows() {
  const windows = [];
  const today = new Date();
  const firstStart = new Date(today);
  firstStart.setMonth(firstStart.getMonth() - 1);
  windows.push({ startDate: toInputDate(firstStart), endDate: toInputDate(today), label: '1 bulan terakhir' });

  let cursorEnd = new Date(firstStart);
  cursorEnd.setDate(cursorEnd.getDate() - 1);
  const minDate = new Date('2020-01-01T00:00:00');

  while (cursorEnd >= minDate) {
    const cursorStart = new Date(cursorEnd);
    cursorStart.setMonth(cursorStart.getMonth() - 1);
    if (cursorStart < minDate) cursorStart.setTime(minDate.getTime());
    windows.push({
      startDate: toInputDate(cursorStart),
      endDate: toInputDate(cursorEnd),
      label: `${formatDateID(cursorStart)} - ${formatDateID(cursorEnd)}`,
    });
    cursorEnd = new Date(cursorStart);
    cursorEnd.setDate(cursorEnd.getDate() - 1);
  }

  return windows;
}

function mergeResults(items = []) {
  const seen = new Set(DATA.map(item => item.link || `${item.region}-${item.title}-${item.date}`));
  const appended = [];
  for (const item of items) {
    const key = item.link || `${item.region}-${item.title}-${item.date}`;
    if (seen.has(key)) continue;
    seen.add(key);
    appended.push(item);
  }
  DATA.push(...appended.sort((a, b) => getTimeValue(b.date) - getTimeValue(a.date)));
  return appended;
}

function setScanStatus(text) {
  const btn = document.getElementById('regionalBtn');
  btn.innerHTML = text;
}

function setScanText(text) {
  document.getElementById('scanStatus').textContent = text;
}

function scheduleScanText(text) {
  requestAnimationFrame(() => setScanText(text));
}

function setButtonReady() {
  const btn = document.getElementById('regionalBtn');
  btn.disabled = false;
  btn.innerHTML = '<i class="ti ti-satellite"></i> Pantau Isu';
}

function getRegionScrollState() {
  const state = {};
  document.querySelectorAll('.region-group').forEach(group => {
    const region = group.dataset.region;
    const list = group.querySelector('.region-list');
    if (region && list) state[region] = list.scrollTop;
  });
  return state;
}

function restoreRegionScrollState(state = {}) {
  requestAnimationFrame(() => {
    document.querySelectorAll('.region-group').forEach(group => {
      const region = group.dataset.region;
      const list = group.querySelector('.region-list');
      if (region && list && state[region] !== undefined) list.scrollTop = state[region];
    });
  });
}

function renderSkeletons() {
  const regions = getTags();
  document.getElementById('resultsList').innerHTML = regions.map(region => `
    <section class="region-group">
      <div class="region-head">
        <div class="region-title"><i class="ti ti-map-pin"></i><span>${escapeHtml(region)}</span></div>
        <span class="region-count">loading</span>
      </div>
      <div class="region-list">
        ${Array.from({ length: 3 }, () => `
          <div class="card skeleton">
            <div class="card-icon"></div>
            <div class="card-body">
              <div class="line" style="width:45%"></div>
              <div class="line" style="width:92%;height:14px"></div>
              <div class="line" style="width:70%"></div>
            </div>
          </div>
        `).join('')}
      </div>
    </section>
  `).join('');
}

function renderCard(item) {
  const link = safeLink(item.link);
  return `
    <article class="card">
      <div class="card-icon"><i class="ti ti-news"></i></div>
      <div class="card-body">
        <div class="meta">
          <span class="badge">${escapeHtml(item.issue || 'ISU')}</span>
          <span>${escapeHtml(item.source || 'Unknown')}</span>
          <span class="date">${formatDateID(item.date)}</span>
        </div>
        <h3 class="title">${escapeHtml(item.title || '-')}</h3>
        <div class="snippet">Daerah: ${escapeHtml(item.region || '-')} | Isu: ${escapeHtml(item.issue || '-')}</div>
        <a class="open" href="${escapeHtml(link || '#')}" target="_blank" rel="noopener noreferrer"><i class="ti ti-external-link"></i> Buka berita</a>
      </div>
    </article>
  `;
}

function getRegionGroup(region) {
  return [...document.querySelectorAll('.region-group')]
    .find(group => group.dataset.region === region);
}

function refreshRegionFilter(region, items) {
  const group = getRegionGroup(region);
  if (!group) return;
  const filter = group.querySelector('.issue-filter');
  if (filter) filter.outerHTML = renderIssueFilter(region, items);
}

function appendResultsSmooth(items = []) {
  if (!items.length) return;
  updateCounts();

  const grouped = new Map();
  for (const item of items) {
    const region = item.region || 'Lainnya';
    if (!grouped.has(region)) grouped.set(region, []);
    grouped.get(region).push(item);
  }

  for (const [region, regionItems] of grouped.entries()) {
    const allRegionItems = DATA.filter(item => String(item.region || '').toLowerCase() === region.toLowerCase());
    const activeIssue = regionIssueFilters[region] || 'Semua';
    const group = getRegionGroup(region);
    if (!group) {
      requestAnimationFrame(renderResults);
      continue;
    }

    group.querySelector('.region-count').textContent = `${allRegionItems.length} isu`;
    refreshRegionFilter(region, allRegionItems);

    const list = group.querySelector('.region-list');
    if (!list) continue;
    const empty = list.querySelector('.empty');
    if (empty) empty.remove();

    const visibleNewItems = activeIssue === 'Semua'
      ? regionItems
      : regionItems.filter(item => String(item.issue || 'Isu Daerah') === activeIssue);
    if (!visibleNewItems.length) continue;

    const fragment = document.createDocumentFragment();
    for (const item of visibleNewItems) {
      const template = document.createElement('template');
      template.innerHTML = renderCard(item).trim();
      fragment.appendChild(template.content.firstElementChild);
    }
    requestAnimationFrame(() => list.appendChild(fragment));
  }
}

function renderResults() {
  const scrollState = getRegionScrollState();
  updateCounts();
  const list = document.getElementById('resultsList');
  if (!hasSearched) {
    list.innerHTML = '<div class="empty"><div><i class="ti ti-map-search" style="font-size:48px"></i><p>Tambahkan daerah lalu klik Pantau Isu.</p></div></div>';
    return;
  }
  if (!DATA.length) {
    const regions = getTags();
    if (!regions.length) {
      list.innerHTML = '<div class="empty"><div><i class="ti ti-map-search" style="font-size:48px"></i><p>Tambahkan daerah lalu klik Pantau Isu.</p></div></div>';
      return;
    }
    list.innerHTML = regions.map(region => `
      <section class="region-group" data-region="${escapeHtml(region)}">
        <div class="region-head">
          <div class="region-title"><i class="ti ti-map-pin"></i><span>${escapeHtml(region)}</span></div>
          <span class="region-count">0 isu</span>
        </div>
        <div class="issue-filter"><button class="issue-btn active" type="button">Semua</button></div>
        <div class="region-list">
          <div class="empty" style="min-height:180px"><div><i class="ti ti-news-off" style="font-size:34px"></i><p>Belum ada isu untuk daerah ini.</p></div></div>
        </div>
      </section>
    `).join('');
    restoreRegionScrollState(scrollState);
    return;
  }

  const sorted = DATA.map((item, index) => ({ ...item, originalIndex: index }));
  const groups = getTags().map(region => ({
    region,
    items: sorted.filter(item => String(item.region || '').toLowerCase() === region.toLowerCase()),
  }));
  const extraItems = sorted.filter(item => !groups.some(group => String(item.region || '').toLowerCase() === group.region.toLowerCase()));
  if (extraItems.length) groups.push({ region: 'Lainnya', items: extraItems });

  list.innerHTML = groups.map(group => `
    <section class="region-group" data-region="${escapeHtml(group.region)}">
      <div class="region-head">
        <div class="region-title"><i class="ti ti-map-pin"></i><span>${escapeHtml(group.region)}</span></div>
        <span class="region-count">${group.items.length} isu</span>
      </div>
      ${renderIssueFilter(group.region, group.items)}
      <div class="region-list">
        ${getFilteredRegionItems(group.region, group.items).length ? getFilteredRegionItems(group.region, group.items).map(renderCard).join('') : '<div class="empty" style="min-height:180px"><div><i class="ti ti-news-off" style="font-size:34px"></i><p>Belum ada isu untuk daerah ini.</p></div></div>'}
      </div>
    </section>
  `).join('');
  restoreRegionScrollState(scrollState);
}

function getFilteredRegionItems(region, items) {
  const activeIssue = regionIssueFilters[region] || 'Semua';
  if (activeIssue === 'Semua') return items;
  return items.filter(item => String(item.issue || 'Isu Daerah') === activeIssue);
}

function renderIssueFilter(region, items) {
  const issues = ['Semua', ...new Set(items.map(item => item.issue || 'Isu Daerah').filter(Boolean))];
  const activeIssue = regionIssueFilters[region] || 'Semua';
  return `
    <div class="issue-filter">
      ${issues.map(issue => `
        <button class="issue-btn ${issue === activeIssue ? 'active' : ''}" type="button" data-region="${escapeHtml(region)}" data-issue="${escapeHtml(issue)}">
          ${escapeHtml(issue)}
        </button>
      `).join('')}
    </div>
  `;
}

async function runRegionalIssues(scanId) {
  const regions = getTags();
  if (!regions.length) {
    alert('Daerah wajib diisi.');
    return;
  }

  activeScanId = scanId;
  DATA = [];
  regionIssueFilters = {};
  hasSearched = true;
  isArchiveScanning = true;
  renderSkeletons();

  const windows = buildScanWindows();
  for (let i = 0; i < windows.length; i++) {
    if (activeScanId !== scanId) return;
    const window = windows[i];
    if (i === 0) {
      setScanStatus('<i class="ti ti-loader-2" style="font-size:16px;animation:spin 1s linear infinite"></i> Memantau...');
    }
    scheduleScanText(`${i === 0 ? 'mencari 1 bulan terakhir' : 'mencari arsip ' + window.label}`);

    const response = await fetch('/api/regional-issues', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        regions,
        startDate: window.startDate,
        endDate: window.endDate,
        maxPerRegion: 30,
      }),
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'Gagal mengambil isu daerah');

    const addedItems = mergeResults(Array.isArray(data.results) ? data.results : []);
    if (i === 0 || !document.querySelector('.region-group')) {
      renderResults();
    } else if (addedItems.length) {
      appendResultsSmooth(addedItems);
    }
    if (i === 0) {
      setButtonReady();
      setScanText('hasil 1 bulan tampil, arsip lanjut di latar belakang');
    }
  }
  isArchiveScanning = false;
  setScanText('selesai sampai 2020');
}

document.getElementById('regionInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    addRegion();
  }
});

document.getElementById('regionTags').addEventListener('click', (e) => {
  if (e.target.classList.contains('remove')) {
    e.target.parentElement.remove();
    DATA = DATA.filter(item => getTags().some(region => String(item.region || '').toLowerCase() === region.toLowerCase()));
    updateCounts();
    renderResults();
  }
});

document.getElementById('regionalBtn').addEventListener('click', async () => {
  const scanId = Date.now();
  activeScanId = scanId;
  const btn = document.getElementById('regionalBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader-2" style="font-size:16px;animation:spin 1s linear infinite"></i> Memantau...';
  runRegionalIssues(scanId).catch((err) => {
    if (activeScanId === scanId) {
      if (!DATA.length) {
        DATA = [];
        hasSearched = true;
        renderResults();
        setScanText('gagal');
        alert('Gagal pantau isu daerah: ' + err.message);
      } else {
        setScanText('arsip berhenti: ' + err.message);
      }
    }
  }).finally(() => {
    if (activeScanId === scanId) {
      isArchiveScanning = false;
      setButtonReady();
    }
  });
});

document.getElementById('resultsList').addEventListener('click', (e) => {
  const filterBtn = e.target.closest('.issue-btn');
  if (filterBtn) {
    regionIssueFilters[filterBtn.dataset.region] = filterBtn.dataset.issue;
    renderResults();
    return;
  }
  if (e.target.closest('.open')) return;
});

['Riau', 'Kalimantan Timur', 'Papua'].forEach(addRegion);
renderResults();
</script>
</body>
</html>
