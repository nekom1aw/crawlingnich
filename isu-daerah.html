<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Isu Daerah Realtime</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@500;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link rel="stylesheet" href="/src/header.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important; }
  :root {
    --bg: #0d0f14;
    --bg2: #13161d;
    --bg3: #1a1e28;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #f0f2f8;
    --text2: #8b90a0;
    --text3: #555c6e;
    --green: #9dffc1;
    --font-head: 'Syne', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'DM Mono', monospace;
  }
  body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 14px; overflow: hidden; }
  .shell { display: grid; grid-template-rows: 56px auto 1fr; height: 100vh; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  @keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
  @keyframes shimmer { 0%{background-position:100% 0} 100%{background-position:-100% 0} }

  .control-band { display: grid; grid-template-columns: minmax(260px, 360px) auto minmax(260px, 1fr); gap: 10px; align-items: center; padding: 14px 24px; background: #10131a; border-bottom: 1px solid var(--border); }
  .input-wrap { position: relative; }
  .input-wrap input { width: 100%; height: 40px; padding: 0 12px 0 36px; background: var(--bg3); border: 1px solid var(--border2); color: var(--text); outline: none; font-family: var(--font-body); font-size: 13px; }
  .input-wrap input:focus { border-color: #fff; }
  .input-wrap input::placeholder { color: var(--text3); }
  .input-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 15px; pointer-events: none; }
  .btn { height: 40px; padding: 0 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: #fff; border: 1px solid #fff; color: #000; font-family: var(--font-head); font-weight: 700; cursor: pointer; }
  .btn:disabled { opacity: 0.65; cursor: wait; }
  .tags-list { display: flex; flex-wrap: wrap; gap: 6px; min-height: 32px; align-items: center; }
  .tag { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border: 1px solid rgba(113,255,174,0.42); background: rgba(113,255,174,0.08); color: var(--green); font-size: 11px; font-family: var(--font-mono); cursor: pointer; }
  .tag .remove { opacity: 0.65; }

  .main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 420px; overflow: hidden; }
  .content { min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
  .stats { display: flex; gap: 20px; padding: 12px 24px; border-bottom: 1px solid var(--border); color: var(--text2); font-size: 12px; }
  .stats strong { color: #fff; font-family: var(--font-mono); }
  .results { flex: 1; min-height: 0; overflow: hidden; padding: 22px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); grid-auto-rows: minmax(0, 1fr); align-items: stretch; gap: 14px; }
  .region-group { min-width: 0; min-height: 0; height: 100%; border: 1px solid var(--border2); background: rgba(255,255,255,0.025); display: flex; flex-direction: column; }
  .region-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 14px; border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.045); }
  .region-title { min-width: 0; display: flex; align-items: center; gap: 8px; font-family: var(--font-head); font-size: 16px; font-weight: 800; }
  .region-title span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .region-count { flex-shrink: 0; color: var(--green); border: 1px solid rgba(113,255,174,0.42); padding: 3px 8px; font-family: var(--font-mono); font-size: 10px; }
  .region-list { flex: 1; min-height: 0; padding: 12px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; overscroll-behavior: contain; }
  .card { background: var(--bg2); border: 1px solid var(--border); padding: 14px; display: flex; gap: 12px; cursor: pointer; }
  .card:hover, .card.selected { border-color: #fff; background: rgba(255,255,255,0.055); }
  .card-icon { width: 36px; height: 36px; display: grid; place-items: center; flex-shrink: 0; border: 1px solid rgba(113,255,174,0.42); color: var(--green); font-size: 16px; }
  .card-body { min-width: 0; flex: 1; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 7px; color: var(--text3); font-family: var(--font-mono); font-size: 11px; }
  .badge { color: var(--green); border: 1px solid rgba(113,255,174,0.42); padding: 2px 8px; }
  .date { width: 100%; color: var(--text2); }
  .title { color: var(--text); line-height: 1.45; font-weight: 500; margin-bottom: 6px; }
  .snippet { color: var(--text2); font-size: 12px; line-height: 1.6; }
  .open { margin-top: 11px; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; background: #fff; color: #000; text-decoration: none; font-family: var(--font-mono); font-size: 11px; }
  .empty { flex: 1; display: grid; place-items: center; color: var(--text3); text-align: center; line-height: 1.7; }
  .skeleton { pointer-events: none; }
  .skeleton .line, .skeleton .card-icon, .skeleton-region { background: linear-gradient(90deg, rgba(255,255,255,0.04), rgba(255,255,255,0.12), rgba(255,255,255,0.04)); background-size: 200% 100%; animation: shimmer 1.3s linear infinite; }
  .skeleton .line { height: 12px; margin-bottom: 9px; }

  .preview { min-width: 0; background: var(--bg2); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  .preview-top { padding: 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
  .preview-label { color: #fff; font-family: var(--font-mono); font-size: 10px; letter-spacing: 1px; text-transform: uppercase; display: flex; align-items: center; gap: 7px; }
  .preview-title { font-family: var(--font-head); font-size: 18px; line-height: 1.32; }
  .preview-meta { color: var(--text2); font-family: var(--font-mono); font-size: 11px; line-height: 1.5; }
  iframe { flex: 1; min-height: 0; border: 0; background: #101217; }
  .preview-empty { flex: 1; display: grid; place-items: center; color: var(--text3); text-align: center; padding: 24px; line-height: 1.6; }

  @media (max-width: 1024px) {
    body { overflow: auto; }
    .shell { min-height: 100vh; height: auto; }
    .control-band { grid-template-columns: 1fr; padding: 12px 14px; }
    .main { grid-template-columns: 1fr; overflow: visible; }
    .results { grid-template-columns: 1fr; }
    .region-group { max-height: none; }
    .preview { display: none; }
  }
</style>
</head>
<body>
<div class="shell">
  <div id="appHeader"></div>

  <section class="control-band">
    <div class="input-wrap">
      <i class="ti ti-map-pin input-icon"></i>
      <input type="text" id="regionInput" placeholder="tambah daerah, contoh: Riau..." />
    </div>
    <button class="btn" id="regionalBtn" type="button"><i class="ti ti-satellite"></i> Pantau Isu</button>
    <div class="tags-list" id="regionTags"></div>
  </section>

  <main class="main">
    <section class="content">
      <div class="stats">
        <span><strong id="totalCount">0</strong> total isu</span>
        <span><strong id="regionCount">0</strong> daerah</span>
      </div>
      <div class="results" id="resultsList"></div>
    </section>

    <aside class="preview">
      <div class="preview-top" id="previewTop" hidden>
        <div class="preview-label"><i class="ti ti-layout-sidebar-right"></i> Preview Isu</div>
        <h2 class="preview-title" id="previewTitle">-</h2>
        <div class="preview-meta" id="previewMeta">-</div>
      </div>
      <div class="preview-empty" id="previewEmpty">
        <div>
          <i class="ti ti-map-search" style="font-size:44px;color:var(--text2)"></i>
          <p>Klik kartu isu untuk membaca preview berita di panel kanan.</p>
        </div>
      </div>
      <iframe id="previewFrame" title="Preview isu daerah" hidden referrerpolicy="no-referrer" sandbox="allow-forms allow-popups allow-scripts allow-same-origin"></iframe>
    </aside>
  </main>
</div>

<script src="/src/header.js"></script>
<script>
let DATA = [];
let selectedIndex = null;

function escapeHtml(value = '') {
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function safeLink(link) {
  try {
    const url = new URL(String(link || '').trim());
    return ['http:', 'https:'].includes(url.protocol) ? url.toString() : '';
  } catch {
    return '';
  }
}

function formatDateID(dateStr) {
  const d = new Date(dateStr);
  if (Number.isNaN(d.getTime())) return '-';
  return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
}

function getTimeValue(dateStr) {
  const time = new Date(dateStr).getTime();
  return Number.isNaN(time) ? 0 : time;
}

function getTags() {
  return [...document.querySelectorAll('#regionTags .tag')].map(tag => tag.dataset.value).filter(Boolean);
}

function addRegion(value) {
  const val = String(value || document.getElementById('regionInput').value).trim();
  if (!val) return;
  const exists = getTags().some(tag => tag.toLowerCase() === val.toLowerCase());
  document.getElementById('regionInput').value = '';
  if (exists) return;

  const span = document.createElement('span');
  span.className = 'tag';
  span.dataset.value = val;
  span.innerHTML = `${escapeHtml(val)} <span class="remove">x</span>`;
  document.getElementById('regionTags').appendChild(span);
  updateCounts();
}

function updateCounts() {
  document.getElementById('totalCount').textContent = DATA.length;
  document.getElementById('regionCount').textContent = getTags().length;
}

function renderSkeletons() {
  const regions = getTags();
  document.getElementById('resultsList').innerHTML = regions.map(region => `
    <section class="region-group">
      <div class="region-head">
        <div class="region-title"><i class="ti ti-map-pin"></i><span>${escapeHtml(region)}</span></div>
        <span class="region-count">loading</span>
      </div>
      <div class="region-list">
        ${Array.from({ length: 3 }, () => `
          <div class="card skeleton">
            <div class="card-icon"></div>
            <div class="card-body">
              <div class="line" style="width:45%"></div>
              <div class="line" style="width:92%;height:14px"></div>
              <div class="line" style="width:70%"></div>
            </div>
          </div>
        `).join('')}
      </div>
    </section>
  `).join('');
}

function renderResults() {
  updateCounts();
  const list = document.getElementById('resultsList');
  if (!DATA.length) {
    list.innerHTML = '<div class="empty"><div><i class="ti ti-map-search" style="font-size:48px"></i><p>Tambahkan daerah lalu klik Pantau Isu.</p></div></div>';
    return;
  }

  const sorted = DATA
    .map((item, index) => ({ ...item, originalIndex: index }))
    .sort((a, b) => getTimeValue(b.date) - getTimeValue(a.date));
  const groups = getTags().map(region => ({
    region,
    items: sorted.filter(item => String(item.region || '').toLowerCase() === region.toLowerCase()),
  }));
  const extraItems = sorted.filter(item => !groups.some(group => String(item.region || '').toLowerCase() === group.region.toLowerCase()));
  if (extraItems.length) groups.push({ region: 'Lainnya', items: extraItems });

  list.innerHTML = groups.map(group => `
    <section class="region-group">
      <div class="region-head">
        <div class="region-title"><i class="ti ti-map-pin"></i><span>${escapeHtml(group.region)}</span></div>
        <span class="region-count">${group.items.length} isu</span>
      </div>
      <div class="region-list">
        ${group.items.length ? group.items.map((item) => {
          const link = safeLink(item.link);
          return `
            <article class="card ${item.originalIndex === selectedIndex ? 'selected' : ''}" data-index="${item.originalIndex}">
              <div class="card-icon"><i class="ti ti-news"></i></div>
              <div class="card-body">
                <div class="meta">
                  <span class="badge">${escapeHtml(item.issue || 'ISU')}</span>
                  <span>${escapeHtml(item.source || 'Unknown')}</span>
                  <span class="date">${formatDateID(item.date)}</span>
                </div>
                <h3 class="title">${escapeHtml(item.title || '-')}</h3>
                <div class="snippet">Daerah: ${escapeHtml(item.region || '-')} | Isu: ${escapeHtml(item.issue || '-')}</div>
                <a class="open" href="${escapeHtml(link || '#')}" target="_blank" rel="noopener noreferrer"><i class="ti ti-external-link"></i> Buka berita</a>
              </div>
            </article>
          `;
        }).join('') : '<div class="empty" style="min-height:180px"><div><i class="ti ti-news-off" style="font-size:34px"></i><p>Belum ada isu untuk daerah ini.</p></div></div>'}
      </div>
    </section>
  `).join('');
}

function showPreview(item, index) {
  selectedIndex = index;
  renderResults();
  const link = safeLink(item.link);
  document.getElementById('previewEmpty').hidden = true;
  document.getElementById('previewTop').hidden = false;
  document.getElementById('previewFrame').hidden = false;
  document.getElementById('previewTitle').textContent = item.title || '-';
  document.getElementById('previewMeta').textContent = `${item.region || '-'} | ${item.issue || '-'} | ${formatDateID(item.date)}`;
  document.getElementById('previewFrame').src = link ? `/api/preview?url=${encodeURIComponent(link)}` : 'about:blank';
}

async function runRegionalIssues() {
  const regions = getTags();
  if (!regions.length) {
    alert('Daerah wajib diisi.');
    return;
  }

  renderSkeletons();
  const response = await fetch('/api/regional-issues', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ regions }),
  });
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || 'Gagal mengambil isu daerah');
  DATA = Array.isArray(data.results)
    ? data.results.sort((a, b) => getTimeValue(b.date) - getTimeValue(a.date))
    : [];
  selectedIndex = null;
  renderResults();
}

document.getElementById('regionInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    addRegion();
  }
});

document.getElementById('regionTags').addEventListener('click', (e) => {
  if (e.target.classList.contains('remove')) {
    e.target.parentElement.remove();
    updateCounts();
  }
});

document.getElementById('regionalBtn').addEventListener('click', async () => {
  const btn = document.getElementById('regionalBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader-2" style="font-size:16px;animation:spin 1s linear infinite"></i> Memantau...';
  try {
    await runRegionalIssues();
  } catch (err) {
    DATA = [];
    renderResults();
    alert('Gagal pantau isu daerah: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="ti ti-satellite"></i> Pantau Isu';
  }
});

document.getElementById('resultsList').addEventListener('click', (e) => {
  if (e.target.closest('.open')) return;
  const card = e.target.closest('.card[data-index]');
  if (!card) return;
  const index = Number(card.dataset.index);
  if (Number.isNaN(index)) return;
  showPreview(DATA[index], index);
});

['Riau', 'Kalimantan Timur', 'Papua'].forEach(addRegion);
renderResults();
</script>
</body>
</html>
