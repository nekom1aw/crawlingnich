name: Deploy to cPanel

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: serayu.iixcp.rumahweb.net
      CPANEL_PORT: 2223
      CPANEL_USER: crak4345
      CPANEL_APP_DIR: /home/crak4345/crawlingnich
      CPANEL_NODE_ENV: /home/crak4345/nodevenv/crawlingnich/20/bin/activate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js on GitHub
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and build on GitHub
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Security audit
        continue-on-error: true
        run: |
          npm audit --omit=dev --audit-level=high

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/cpanel_key
          chmod 600 ~/.ssh/cpanel_key
          ssh-keyscan -p "$CPANEL_PORT" "$CPANEL_HOST" >> ~/.ssh/known_hosts

      - name: Create deploy archive
        run: |
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.next/cache' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='github-cpanel-key*' \
            --exclude='github-cpanel-rsa*' \
            -czf /tmp/deploy.tar.gz .

      - name: Upload archive to cPanel
        run: |
          ssh -i ~/.ssh/cpanel_key -p "$CPANEL_PORT" "$CPANEL_USER@$CPANEL_HOST" "mkdir -p '$CPANEL_APP_DIR'"
          scp -i ~/.ssh/cpanel_key -P "$CPANEL_PORT" \
            /tmp/deploy.tar.gz \
            "$CPANEL_USER@$CPANEL_HOST:$CPANEL_APP_DIR/deploy.tar.gz"

      - name: Extract and install production dependencies
        run: |
          ssh -i ~/.ssh/cpanel_key -p "$CPANEL_PORT" "$CPANEL_USER@$CPANEL_HOST" << EOF
            set -e

            source "$CPANEL_NODE_ENV"
            cd "$CPANEL_APP_DIR"

            tar --no-same-owner -xzf deploy.tar.gz
            rm -f deploy.tar.gz

            rm -rf node_modules

            npm install --omit=dev --no-audit --no-fund

            mkdir -p tmp
            touch tmp/restart.txt
          EOF
