name: Deploy to cPanel

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/cpanel_key
          chmod 600 ~/.ssh/cpanel_key
          ssh-keyscan -p 22 serayu.iixcp.rumahweb.net >> ~/.ssh/known_hosts

      - name: Upload files to cPanel
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/cpanel_key -p 22" \
            --exclude ".git" \
            --exclude ".github" \
            --exclude ".next" \
            --exclude "node_modules" \
            --exclude ".env" \
            --exclude ".env.*" \
            ./ "crak4345@serayu.iixcp.rumahweb.net:/home/crak4345/crawlingnich/"

      - name: Install, build, and restart app
        run: |
          ssh -i ~/.ssh/cpanel_key -p 22 "crak4345@serayu.iixcp.rumahweb.net" << 'EOF'
            set -e

            source /home/crak4345/nodevenv/crawlingnich/20/bin/activate
            cd /home/crak4345/crawlingnich

            rm -rf .next

            npm ci
            npm run build

            mkdir -p tmp
            touch tmp/restart.txt
          EOF