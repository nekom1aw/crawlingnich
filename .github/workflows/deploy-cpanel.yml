name: Deploy to cPanel

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js on GitHub
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and build on GitHub
        run: |
          npm ci
          npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/cpanel_key
          chmod 600 ~/.ssh/cpanel_key

      - name: Create deploy archive
        run: |
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='.env.*' \
            -czf /tmp/deploy.tar.gz .

      - name: Upload archive to cPanel
        run: |
          scp -i ~/.ssh/cpanel_key -P 2223 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            /tmp/deploy.tar.gz \
            crak4345@serayu.iixcp.rumahweb.net:/home/crak4345/crawlingnich/deploy.tar.gz

      - name: Extract and install production dependencies
        run: |
          ssh -i ~/.ssh/cpanel_key -p 2223 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            crak4345@serayu.iixcp.rumahweb.net << 'EOF'
            set -e

            source /home/crak4345/nodevenv/crawlingnich/20/bin/activate
            cd /home/crak4345/crawlingnich

            tar -xzf deploy.tar.gz
            rm -f deploy.tar.gz

            rm -rf node_modules

            npm install --omit=dev --no-audit --no-fund

            mkdir -p tmp
            touch tmp/restart.txt
          EOF