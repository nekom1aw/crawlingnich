name: Deploy to cPanel

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: serayu.iixcp.rumahweb.net
      CPANEL_PORT: 2223
      CPANEL_USER: crak4345
      CPANEL_APP_DIR: /home/crak4345/crawlingnich
      CPANEL_NODE_ENV: /home/crak4345/nodevenv/crawlingnich/20/bin/activate
      SSH_OPTS: -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o ConnectTimeout=30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js on GitHub
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and build on GitHub
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Security audit
        continue-on-error: true
        run: |
          npm audit --omit=dev --audit-level=high

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/cpanel_key
          chmod 600 ~/.ssh/cpanel_key
          ssh-keyscan -p "$CPANEL_PORT" "$CPANEL_HOST" >> ~/.ssh/known_hosts

      - name: Validate required AI secret
        run: |
          if [ -z "${{ secrets.NVIDIA_API_KEY }}" ]; then
            echo "NVIDIA_API_KEY GitHub Secret masih kosong. Isi dulu di Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Create deploy archive
        run: |
          set -e
          mkdir -p /tmp/deploy-package/.next

          cp -a .next/standalone/. /tmp/deploy-package/
          cp -a .next/static /tmp/deploy-package/.next/static
          cp -a public /tmp/deploy-package/public

          # cPanel sudah dikonfigurasi memakai server-next.js sebagai startup file.
          cp -f .next/standalone/server.js /tmp/deploy-package/server-next.js

          tar -C /tmp/deploy-package -czf /tmp/deploy.tar.gz .

      - name: Create production env file
        run: |
          {
            printf '%s\n' 'NVIDIA_API_KEY=${{ secrets.NVIDIA_API_KEY }}'
            printf '%s\n' 'NVIDIA_MODEL=${{ secrets.NVIDIA_MODEL }}'
          } > /tmp/env.local.production

          if [ -z "${{ secrets.NVIDIA_MODEL }}" ]; then
            sed -i 's/^NVIDIA_MODEL=$/NVIDIA_MODEL=z-ai\/glm-5.2/' /tmp/env.local.production
          fi

      - name: Create remote deploy script
        run: |
          cat > /tmp/remote-deploy.sh <<'REMOTE'
          set -e

          source "__CPANEL_NODE_ENV__"
          cd "__CPANEL_APP_DIR__"

          # Paket standalone sudah membawa dependency runtime dari GitHub Actions.
          # Bersihkan runtime lama agar tidak ada modul/chunk dari deploy sebelumnya.
          rm -rf .next node_modules

          tar --no-same-owner -xzf deploy.tar.gz
          rm -f deploy.tar.gz

          mv -f .env.local.upload .env.local
          test -s .env.local
          grep -q '^NVIDIA_API_KEY=nvapi-' .env.local
          grep -q '^NVIDIA_MODEL=' .env.local

          mkdir -p tmp
          touch tmp/restart.txt

          rm -f remote-deploy.sh
          REMOTE

          sed -i "s#__CPANEL_NODE_ENV__#$CPANEL_NODE_ENV#g" /tmp/remote-deploy.sh
          sed -i "s#__CPANEL_APP_DIR__#$CPANEL_APP_DIR#g" /tmp/remote-deploy.sh

      - name: Upload archive to cPanel
        run: |
          ssh -T $SSH_OPTS -i ~/.ssh/cpanel_key -p "$CPANEL_PORT" "$CPANEL_USER@$CPANEL_HOST" "mkdir -p '$CPANEL_APP_DIR'"
          scp $SSH_OPTS -i ~/.ssh/cpanel_key -P "$CPANEL_PORT" \
            /tmp/deploy.tar.gz \
            "$CPANEL_USER@$CPANEL_HOST:$CPANEL_APP_DIR/deploy.tar.gz"
          scp $SSH_OPTS -i ~/.ssh/cpanel_key -P "$CPANEL_PORT" \
            /tmp/env.local.production \
            "$CPANEL_USER@$CPANEL_HOST:$CPANEL_APP_DIR/.env.local.upload"
          scp $SSH_OPTS -i ~/.ssh/cpanel_key -P "$CPANEL_PORT" \
            /tmp/remote-deploy.sh \
            "$CPANEL_USER@$CPANEL_HOST:$CPANEL_APP_DIR/remote-deploy.sh"

      - name: Extract standalone build and restart application
        timeout-minutes: 5
        run: |
          ssh -T $SSH_OPTS -i ~/.ssh/cpanel_key -p "$CPANEL_PORT" "$CPANEL_USER@$CPANEL_HOST" "bash '$CPANEL_APP_DIR/remote-deploy.sh'"
