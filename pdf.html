<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Search PDF</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-10">

    <div class="max-w-2xl mx-auto bg-white p-6 shadow">

        <h1 class="text-xl font-bold mb-4">🔍 Cari PDF</h1>

        <input id="keyword" type="text"
            placeholder="Contoh: toba pulp lestari"
            class="w-full border p-2 mb-4">

        <button onclick="searchPDF()"
            class="bg-blue-600 text-white px-4 py-2">
            Cari PDF
        </button>

        <div id="result" class="mt-6 space-y-3"></div>
    </div>

    <script>
        async function searchPDF() {
            const keyword = document.getElementById('keyword').value;

            const res = await fetch('http://localhost:3001/api/search-pdf', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ keyword })
            });

            const data = await res.json();

            const container = document.getElementById('result');
            container.innerHTML = '';

            if (!data.results || data.results.length === 0) {
                container.innerHTML = '<p>Tidak ada PDF ditemukan</p>';
                return;
            }

            data.results.forEach(item => {
                container.innerHTML += `
                    <div class="border p-3">
                        <p class="font-semibold">${item.title}</p>
                        <a href="${item.link}" target="_blank" class="text-blue-600">
                            Buka PDF
                        </a>
                    </div>
                `;
            });
        }
    </script>

</body>
</html>
